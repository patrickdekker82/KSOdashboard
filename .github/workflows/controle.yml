# Controle bij elke push en pull request.
#
# Drie banen, met opzet gescheiden. `controle` is snel en draait op Linux: die
# hoort binnen een paar minuten klaar te zijn en blokkeert het werk. `schermen`
# start de gebouwde kern in de hostmodus en loopt met een browser de weg die een
# gebruiker loopt. `installer` draait op Windows en bouwt de échte
# NSIS-installer.
#
# Die tweede baan is er niet voor de sier. Vier fouten die de applicatie
# onbruikbaar maakten — een ontbrekend `main`-veld, niet meegeleverde
# afhankelijkheden, een ESM-bundel die geen CommonJS-pakket kon laden en een
# ontbrekend pictogram — kwamen geen van alle boven bij `npm run build`. Ze
# kwamen boven bij het echt inpakken. Dat hoort dus in CI te staan en niet in
# het hoofd van degene die toevallig aan de beurt is.

name: Controle

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Een nieuwe push maakt een lopende controle op dezelfde tak overbodig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    name: Typen, lint en tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # De kern gebruikt het ingebouwde node:sqlite; dat vraagt 22.13 of
          # nieuwer. Zie ook "engines" in package.json.
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Typen, lint en tests
        run: npm run check

      - name: Bouwen
        run: npm run build

  schermen:
    name: Schermen in een browser (e2e)
    runs-on: ubuntu-latest
    # Pas als de snelle controle groen is; anders is dit alleen ruis achter een
    # fout die al gemeld is.
    needs: controle
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Browser ophalen
        run: npx playwright install --with-deps chromium

      # De scenario's draaien tegen de gebouwde kern (`out/main/core/host.cjs`)
      # naast `out/renderer`: alleen zo bewijzen ze iets over wat er straks
      # geïnstalleerd wordt.
      - name: Bouwen
        run: npm run build

      - name: Scenario's draaien
        run: npx playwright test

      - name: Verslag bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-verslag
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  installer:
    name: Windows-installer bouwen
    runs-on: windows-latest
    # Pas als de snelle controle groen is: een installer bouwen kost minuten en
    # heeft geen zin als de tests al rood staan.
    needs: controle
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Installer bouwen
        run: npm run build:win
        env:
          # Geen ondertekening in CI: daar is een certificaat voor nodig dat
          # niet in een publieke repository hoort. De installer werkt wel,
          # Windows toont alleen een SmartScreen-waarschuwing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Controleren dat de ingepakte applicatie compleet is
        shell: bash
        run: |
          set -euo pipefail

          uitgepakt="release/win-unpacked/resources"
          test -f "$uitgepakt/app.asar" || { echo "geen app.asar"; exit 1; }

          # De hasher is een native module en moet uitgepakt naast de asar
          # staan; zit hij erin, dan start de applicatie niet.
          test -d "$uitgepakt/app.asar.unpacked/node_modules/@node-rs" \
            || { echo "@node-rs/argon2 ontbreekt in de installatie"; exit 1; }

          # De migraties worden als leesbaar bestand meegeleverd.
          test -f "$uitgepakt/db/migrations/0001_initieel.sql" \
            || { echo "de migraties ontbreken"; exit 1; }

          # En het beginpunt waar electron-builder naar zoekt.
          #
          # `asar list` bouwt zijn paden met path.join vanaf "/", dus op Windows
          # komt er \out\main\index.cjs uit en op Linux /out/main/index.cjs.
          # Zonder die vertaling faalt deze controle altijd op Windows, terwijl
          # de installer gewoon klopt — precies wat er hier gebeurde.
          #
          # De listing eerst apart ophalen: als `asar` zelf omvalt, is dat een
          # andere fout dan een ontbrekend bestand, en dan hoort er ook een
          # andere melding te staan.
          if ! inhoud="$(npx --no-install asar list "$uitgepakt/app.asar")"; then
            echo "de asar kon niet gelezen worden — staat @electron/asar geïnstalleerd?"
            exit 1
          fi

          printf '%s\n' "$inhoud" | tr '\\' '/' | grep -qx "/out/main/index.cjs" \
            || { echo "het beginpunt out/main/index.cjs zit niet in de asar"; exit 1; }

          echo "De installatie bevat alles wat nodig is."

      - name: Installer bewaren
        uses: actions/upload-artifact@v6
        with:
          name: ShowroomSuite-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
